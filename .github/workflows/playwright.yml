name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# OWASP CI/CD Hardening: Restrict default permissions to read-only
permissions:
  contents: read

# Cancel in-progress runs on the same branch/PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run E2E & API Tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    env:
      CI: true
      BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'SecurePassword123!' }}
      WORKERS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Generate .env from GitHub Secrets (Isolated in Runner)
        run: |
          touch .env
          echo "BASE_URL=${{ vars.BASE_URL || 'https://automationexercise.com' }}" >> .env
          if [ -n "${{ secrets.TEST_USER_EMAIL }}" ]; then
            echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          fi
          if [ -n "${{ secrets.TEST_USER_PASSWORD }}" ]; then
            echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          else
            echo "TEST_USER_PASSWORD=SecurePassword123!" >> .env
          fi
          echo "WORKERS=1" >> .env
          echo "CI=true" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Optimize APT Mirrors (Bypass throttled Azure mirror)
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          echo -e 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99custom > /dev/null
          sudo apt-get update -y

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install OS Dependencies (when browsers are cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
